name: Matrix Test Suite with
#jobs, steps,
#actions, runners, Workflow triggers: push,manual workflow, Jobs & matrix
#strategies, Steps & shell commands, Using marketplace actions, Language-specific actions,

on:
  push:
    branches: [ main ]

jobs:
  test-suite:
    strategy:
      matrix:
        # Define the testing dimensions
        operating-system: [ubuntu-latest, windows-latest]
        python-version: ['3.9', '3.10', '3.11']

    # Dynamically scale the operating system selection
    runs-on: ${{ matrix.operating-system }}

    steps:
      - name: Code Checkout
        uses: actions/checkout@v4

      - name: Setup Dynamic Runtime
        uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python-version }}

      - name: Execute Tests
        run: |
          python --version
          echo "Running application checks on ${{ matrix.operating-system }}..."